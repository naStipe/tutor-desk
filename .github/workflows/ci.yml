name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    name: Format, Lint, Typecheck, Test, Database & Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tutordesk
          POSTGRES_USER: tutordesk
          POSTGRES_PASSWORD: tutordesk_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tutordesk -d tutordesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tutordesk:tutordesk_dev_password@localhost:5432/tutordesk
      BETTER_AUTH_SECRET: ci-dummy-secret-key-at-least-thirty-two-characters
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Run static analysis
        run: pnpm run lint

      - name: Run TypeScript typecheck
        run: pnpm run typecheck

      - name: Run unit tests
        run: pnpm run test

      - name: Apply database migrations
        run: pnpm run db:migrate

      - name: Verify database
        run: pnpm run db:check

      - name: Build production bundle
        run: pnpm run build
