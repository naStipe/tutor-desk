services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tutordesk
      POSTGRES_USER: tutordesk
      POSTGRES_PASSWORD: tutordesk_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tutordesk_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutordesk -d tutordesk"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  tutordesk_postgres_data:
